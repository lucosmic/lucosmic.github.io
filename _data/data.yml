    - Machine Design
    - Fabrication
    - ISO 9001

  - role: Member, Freelance Maker
    company: TinkerMill Makerspace
    link: https://www.tinkermill.org/
    time: 2014 -- Present
    location: Longmont, CO
    details: |
      Collaborated with members on 3D design and fabrication techniques, empowering each other to invent and create.
      Leveraged contract projects with local and high-profile clients to refine skills in prototyping, manufacturing, and programming.
      Designed Sensor Conductor: An immersive exhibit on sensors for the Longmont Museum.
    skills:
    - Python
    - Soldering
    - 3D Printing
    - Prototyping
    - Bridgeport Mill

  - role: Art Engineering & Construction (Sub-contractor)
    company: Meow Wolf
    link: https://meowwolf.com/visit/denver
    time: 2020 - Mar 2021
    location: Denver, CO
    details: |
      Coordinated mechanical design and fabrication of critical elements for a permanent art exhibit meeting NFPA standards for safety and flammability.
      Applied directors' technical feedback to rapidly improve an electronic sculpture.
      Provided comprehensive technical documentation on build and maintenance procedures.
    skills:
    - AutoCAD
    - Standards Compliance
    - Integration
    - Documentation

  - role: Product Engineer
    company: EdBoard Technologies
    link: https://www.edboardtechnologies.com/
    time: 2018 - 2023
    location: Boulder, Colorado
    details: |
      Supported an edu-tech STEM startup to deliver product funded on Kickstarter.
      Designed and manufactured demo-ready prototypes of circuitry learning tool.
      Performed preliminary tests to conform to ASTM F963-17 toy safety standards.
      Coordinated a product demo workshop with an after-school kids' group in Spain.
    skills:
    - Product Design
    - Failure Analysis
    - PCB Design
    - DFM (Design for Manufacturing)

  - role: Engineering, Design, Maintenance (Contractor)
    company: Zometool, Inc
    link: https://zometool.com/
    time: 2011 - 2022
    location: Longmont, CO
    details: |
      Installed geometric sculptures shown at Meininger's and Denver Art Museum.
      Designed and built a sheet metal tumbler to simplify separation of plastic parts.
      Created 3D renderings of various Zometool models for instruction books.
      Provided sales support for geometric building toy, involving e-commerce, online marketing, demonstration workshops, and inventory management.
    skills:
    - CAD
    - Packaging Design
    - Adobe InDesign
    - Injection Molding
    - Sheet Metal Fabrication

  - role: Tech Camp Instructor
    company: iD Tech Camps
    link: https://www.idtech.com/
    time: Summer 2017, Summer 2020-'21
    location: Denver, CO + online
    details: |
      Adapted lessons to foster an engaging online environment as a virtual instructor.
      Analyzed and concisely explained advanced topics in Game APIs with Java and Python.
      Troubleshooted technical and programming issues during video-calls.
      Piloted a hands-on student project presentation style with positive feedback.
      Promoted a supportive camp culture as a brand ambassador for iD Tech.
    skills:
    - Leadership
    - Java
    - Python
    - Troubleshooting
    - Behaviour Management

  - role: Engineering Contractor
    company: InRedox LLC
    link: https://www.inredox.com/
    time: Summer 2019
    location: Longmont, CO
    details: |
      Completed a Raspberry Pi based automated titrator including mechanical fixture design, programming of sensors and actuators, and GUI with Python.
      Updated CAD models of a fixture for a step in the ALD wafer manufacturing process.
    skills:
    - SolidWorks
    - Industrial Automation
    - Optics
    - Python

