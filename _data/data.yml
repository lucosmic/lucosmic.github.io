  info:
  - role: CAD Design + Engineering Technician
    company: Elementum 3D
    link: https://www.elementum3d.com/
    time: Oct 2021 -- May 2024
    location: Erie, Colorado
    details: |
      Generated 3D CAD layouts for industrial equipment and fabrication drawings of mechanical system assemblies.
      Integrated vendor designs to inform critical decisions.
      Built industrial equipment structure for investor showcase.
      Refined details of P&ID diagrams for Industrial Automation Controls team.
      Operated metallurgical lab equipment ensuring adherence to procedures, safety protocols, and documentation requirements.
    skills:
