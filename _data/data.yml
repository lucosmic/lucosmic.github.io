career-profile:
  title: Career Profile
  summary: |
    Engineer, Educator & Innovator with extensive experience in industrial 3D design, CAD engineering, and art construction.
    Passionate about empowering others to invent and create through collaboration and mentorship.
    Specializes in mechanical design, prototyping, fabrication, and bringing creative visions to life while meeting safety standards.
education:
  title: Education
  info:
  - degree: B.S. in Mechanical Engineering
    university: University of Colorado Boulder
    time: Graduated May 2020
    details: |
      GPA: 3.14
      Passed FE Exam
      
      Notable coursework and projects:
        - Flow Visualization: Photography and scientific essays of fluid phenomena (flowvis.org/author/2018lukec)
        - Thermodynamics: Designed and built turbojet engine in CAD; exceeded final project standards
        - Capstone Project with EmergenTek: Developed CAD design, drawings, and 3D-printed prototypes for handheld Target Acquisition Device meeting NFPA standards
        - Won People's Choice Award at CU Boulder Engineering Projects Expo 2019

  - degree: Engineering & Society in Spain Study Abroad Program
    university: CIEE + Universidad Carlos III Madrid
    time: Aug -- Dec 2019
    details: |
      Achieved Español A2 fluency through immersion program.

experiences:
